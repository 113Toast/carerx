<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>仿單原文查詢</title><style>body{font:16px system-ui,sans-serif;background:#f4f2ec;color:#1f4a44;max-width:900px;margin:32px auto;padding:0 16px}input,button{font:inherit;padding:10px}input{width:65%}button{cursor:pointer}section,details{background:white;padding:16px;margin:12px 0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}img{max-width:200px}a{color:#2f6b63}input,button{border:1.5px solid #e3dfd5;border-radius:10px}button{background:#2f6b63;color:white;border-radius:999px}section,details{background:#fdfcf9;border-top:4px solid #2f6b63;box-shadow:0 6px 18px #28322d14}</style><a href="./">← 返回用藥檢核</a><h1>官方仿單原文查詢</h1><p>中／低可信度文字須核對原始仿單。不得以此取代藥師判斷。</p><input id="q" placeholder="藥名、成分、健保碼、許可證"><button id="go">搜尋</button><section id="results">載入中</section><div id="detail"></div><script>
let rows=[];const $=id=>document.getElementById(id);function el(tag,text,parent){let x=document.createElement(tag);x.textContent=text;parent.append(x);return x}fetch('./data/tfda_drugs_index.json').then(r=>r.json()).then(x=>{rows=x;$('results').textContent='請輸入關鍵字'}).catch(()=>{$('results').textContent='載入失敗'});function search(){let q=$('q').value.normalize('NFKC').toLowerCase().trim();$('results').replaceChildren();if(!q)return;let found=rows.filter(d=>[d.license_id,d.name_zh,d.name_en,...d.ingredients,...d.nhi_codes].join(' ').normalize('NFKC').toLowerCase().includes(q)).slice(0,30);if(!found.length)el('p','找不到資料',$('results'));for(let d of found){let b=el('button',(d.name_zh||d.name_en)+' '+d.nhi_codes.join(' / '),$('results'));b.onclick=()=>show(d.license_id);el('br','',$('results'))}}$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};async function show(id){let root=$('detail');root.textContent='讀取中';try{let item=rows.find(x=>x.license_id===id);if(!item)throw Error();let r=await fetch('./data/records/record_'+item.p+'.json');if(!r.ok)throw Error();let d=(await r.json())[id];if(!d)throw Error();root.replaceChildren();el('h2',d.drug.name_zh||d.drug.name_en,root);el('p','可信度：'+d.drug.label_confidence+'｜'+id,root);if(d.drug.image_urls.length){let im=el('img','',root);im.src=d.drug.image_urls[0];im.alt='藥品外觀'}if(d.license?.label_url&&/^https?:\/\//i.test(d.license.label_url)){let a=el('a','官方原始仿單',root);a.href=d.license.label_url;a.target='_blank';a.rel='noopener noreferrer'}for(let [title,items] of [['仿單重點',d.key_points],['仿單全文',d.sections]]){el('h3',title,root);for(let s of items){let box=el('details','',root);el('summary',s.title||s.tag_label,box);el('pre',s.text||'',box)}}}catch(e){root.textContent='讀取失敗'}}
</script></html>
